# Copy of .github/workflows/verify.yml, kept here so the CI definition is
# reviewable in a normal diff. If you edit one, edit the other.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean (toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lean/*.lean') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Build, check axioms, run the witness
        run: python scripts/verify.py

      - name: Upload the witness manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-manifest
          path: witness-manifest.json
          if-no-files-found: warn
